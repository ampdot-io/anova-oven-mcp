[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "anova-oven-mcp"
version = "0.1.0"
description = "Portable Python client and MCP server for the Anova Precision Oven"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Codex and project contributors" }]
dependencies = [
  "httpx>=0.27,<1",
  "websockets>=14,<16",
]

[project.optional-dependencies]
camera = [
  "aiortc>=1.15,<2",
  "av>=16,<19",
  "Pillow>=10,<13",
]
mcp = [
  "mcp>=2.0,<3",
  "pydantic>=2.9,<3",
]
server = [
  "aiortc>=1.15,<2",
  "av>=16,<19",
  "Pillow>=10,<13",
  "mcp>=2.0,<3",
  "pydantic>=2.9,<3",
]
test = [
  "mypy>=2.3,<3",
  "pytest>=8,<10",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.16,<1",
]

[project.scripts]
anova-oven-mcp = "anova_oven_mcp.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
anova_oven = ["py.typed"]
anova_oven_mcp = ["py.typed"]

[tool.pytest.ini_options]
addopts = "-q"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: requires a real Anova account and oven",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ASYNC", "RUF"]
ignore = ["ASYNC109"]
